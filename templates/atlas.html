<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScenicFly · 景点星图</title>
<link rel="stylesheet" href="/static/css/atlas.css">
</head>
<body>

<div class="atmos" aria-hidden="true"></div>
<canvas id="graph"></canvas>
<div class="grain" aria-hidden="true"></div>

<span class="corner tl" aria-hidden="true"></span>
<span class="corner tr" aria-hidden="true"></span>
<span class="corner bl" aria-hidden="true"></span>
<span class="corner br" aria-hidden="true"></span>

<div class="nav">
  <div class="kick">ScenicFly · Scenic Atlas</div>
  <h1>景点星图 <em>· 星旅台</em></h1>
  <div class="rule"></div>
  <p>拖拽旋转星球 · 滚轮缩放 · 点击景点穿越去生成</p>
</div>

<div class="topright">
  <div class="search-wrap">
    <input id="search" type="text" placeholder="搜城市或景点…" autocomplete="off">
  </div>
  <button class="view-toggle-btn" id="viewToggle" type="button"></button>
  <a class="nav-btn" href="/studio">进入生成台 →</a>
</div>

<div class="legend">
  <div class="lt">Categories · 图例</div>
  <div id="legendItems"></div>
</div>

<div class="toolbar">
  <button id="btnReset">复位</button>
  <button id="btnPause">静止</button>
</div>

<div class="statusline"><b id="statN">0</b> 景点 · <b id="statE">0</b> 城市 · 点亮一座，开始创作</div>

<div class="tip" id="tip"></div>

<aside class="panel" id="panel">
  <button class="pclose" id="pclose">✕</button>
  <div class="pthumb" id="pThumb"></div>
  <div class="pcat" id="pCat"><span class="dot" id="pDot"></span><span id="pCatText"></span></div>
  <h2 id="pName"></h2>
  <div id="pBody"></div>
</aside>

<script>window.GRAPH_DATA = {{ graph_data|tojson }};</script>
<script>
(function () {
  var view = new URLSearchParams(location.search).get('view') || localStorage.getItem('atlasView') || '3d';
  function load(src, cb) { var s = document.createElement('script'); s.src = src; if (cb) s.onload = cb; document.body.appendChild(s); }
  if (view === '2d') { load('/static/js/atlas2d.js'); }
  else { load('/static/js/lib/three.min.js', function () { load('/static/js/atlas.js'); }); }
  var btn = document.getElementById('viewToggle');
  if (btn) {
    btn.textContent = (view === '2d') ? '🌍 3D 星球' : '◐ 2D 星图';
    btn.title = (view === '2d') ? '切换到 3D 卡通星球' : '切换到 2D 平面星球';
    btn.addEventListener('click', function () { localStorage.setItem('atlasView', view === '2d' ? '3d' : '2d'); location.href = '/'; });
  }
})();
</script>
</body>
</html>
