<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>景区讲解词 &rarr; 社交营销内容 一键转换</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<canvas id="fxCanvas"></canvas>
<div id="warpArrive" class="warp-arrive"></div>

<header class="topbar">
  <a class="topbar-back" href="/">← 景点星图</a>
  <span class="topbar-brand">文旅转译局</span>
  <span class="topbar-sub">讲解词 → 小红书 · 抖音 · 朋友圈</span>
</header>

<div class="main-layout">
  <!-- 左侧参数面板 -->
  <aside class="side-panel">
    <div class="panel-section">
      <div class="panel-label">讲解词原文</div>
      <textarea id="inputText" placeholder="从「景点星图」点选景点，自动带入该景点的讲解词原文并开始；也可直接输入景点名或粘贴讲解词原文"></textarea>
      <div class="tool-row">
        <span class="char-count" id="charCount">0 字</span>
        <button class="btn btn-ghost" onclick="pasteText()">粘贴</button>
        <button class="btn btn-ghost" onclick="clearText()">清空</button>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-label">内容风格</div>
      <div class="style-row">
        <div class="style-group">
          <span class="style-icon xhs-dot"></span>
          <select id="xhsStyle" onchange="regenSingle('xiaohongshu')">
            <option value="种草探店">种草探店</option>
            <option value="干货攻略">干货攻略</option>
            <option value="情绪打卡">情绪打卡</option>
          </select>
        </div>
        <div class="style-group">
          <span class="style-icon dy-dot"></span>
          <select id="dyStyle" onchange="regenSingle('douyin')">
            <option value="正经解说">正经解说</option>
            <option value="搞笑旁白">搞笑旁白</option>
            <option value="打卡推荐">打卡推荐</option>
          </select>
        </div>
      </div>
      <div class="style-row">
        <div class="style-group">
          <span class="style-icon pyq-dot"></span>
          <select id="pyqStyle" onchange="regenSingle('pengyouquan')">
            <option value="文艺清新">文艺清新</option>
            <option value="生活烟火">生活烟火</option>
            <option value="极简金句">极简金句</option>
          </select>
        </div>
        <div class="style-group" style="flex:2;">
          <span class="style-icon custom-dot"></span>
          <input type="text" id="customStyle" placeholder="自选风格，如：用00后语气写…" onchange="regenSingle(currentTab())">
        </div>
      </div>
    </div>

    <div class="entity-section" id="entitySection" style="display:none;">
      <div class="panel-label">识别实体</div>
      <div class="entity-badges" id="entityBadges"></div>
    </div>

    <div class="panel-section">
      <button class="btn btn-primary" id="submitBtn" onclick="doConvert()">生成内容</button>
      <div id="errorMsg" class="error-msg" style="display:none;"></div>
    </div>
  </aside>

  <!-- 右侧预览区：手机 App 预览 -->
  <main class="preview-area" id="previewArea">
    <div class="stage-wrap">
    <div class="stage">
      <!-- 平台切换标签 -->
      <div class="plat-tabs" id="platTabs">
        <button class="plat-tab" data-plat="xiaohongshu" onclick="switchPlat('xiaohongshu')" disabled><span class="pt-dot xhs"></span>小红书</button>
        <button class="plat-tab" data-plat="douyin" onclick="switchPlat('douyin')" disabled><span class="pt-dot dy"></span>抖音</button>
        <button class="plat-tab" data-plat="pengyouquan" onclick="switchPlat('pengyouquan')" disabled><span class="pt-dot pyq"></span>朋友圈</button>
      </div>

      <!-- 手机框 -->
      <div class="phone" id="phone">
        <div class="phone-screen" id="phoneScreen">
          <div class="ps-placeholder" id="psPlaceholder">
            <div class="ps-ph-icon">📱</div>
            <div class="ps-ph-title">选择样例，点「生成内容」</div>
            <div class="ps-ph-sub">将逐个生成 小红书 · 抖音 · 朋友圈<br>真实配图 · 可滑动 · 可评论</div>
          </div>
        </div>
      </div>

      <!-- 底部：进度 / 继续下一个 / 本篇操作 -->
      <div class="stage-foot">
        <div class="gen-progress" id="genProgress"></div>
        <div class="phone-actions" id="phoneActions" style="display:none;">
          <button class="btn btn-action" onclick="actionRefine('shorten')">缩短</button>
          <button class="btn btn-action" onclick="actionRefine('vivid')">更生动</button>
          <button class="btn btn-action" onclick="actionRegen()">重写本篇</button>
          <button class="btn btn-action btn-copy" onclick="actionCopy()">复制文案</button>
        </div>
      </div>
    </div>
    <aside class="stage-fx" id="stageFx"></aside>
    </div>
  </main>
</div>

<script src="/static/js/fx.js"></script>
<script src="/static/js/utils.js"></script>
<script src="/static/js/render.js"></script>
<script src="/static/js/entities.js"></script>
<script src="/static/js/main.js"></script>
<script>
  // 从星图穿越而来：播放到达收束动画
  if (new URLSearchParams(location.search).get('from') === 'atlas') {
    var wa = document.getElementById('warpArrive');
    if (wa) { wa.classList.add('play'); setTimeout(function () { wa.style.display = 'none'; }, 900); }
  } else {
    var wa2 = document.getElementById('warpArrive'); if (wa2) wa2.style.display = 'none';
  }
</script>
</body>
</html>
