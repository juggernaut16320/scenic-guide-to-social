<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>景区讲解词 &rarr; 社交营销内容 一键转换</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<header class="topbar">
  <span class="topbar-brand">ScenicFly</span>
  <span class="topbar-sub">景区讲解词转社交营销内容</span>
</header>

<div class="main-layout">
  <!-- 左侧参数面板 -->
  <aside class="side-panel">
    <div class="panel-section">
      <div class="panel-label">样例模板</div>
      <div class="sample-tags" id="sampleTags"></div>
    </div>

    <div class="panel-section">
      <div class="panel-label">讲解词原文</div>
      <textarea id="inputText" placeholder="输入城市名自动推荐景点，输入景点名自动补全讲解词，也可直接粘贴 300-800 字官方讲解词"></textarea>
      <div class="tool-row">
        <span class="char-count" id="charCount">0 字</span>
        <button class="btn btn-ghost" onclick="pasteText()">粘贴</button>
        <button class="btn btn-ghost" onclick="clearText()">清空</button>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-label">内容风格</div>
      <div class="style-row">
        <div class="style-group">
          <span class="style-icon xhs-dot"></span>
          <select id="xhsStyle" onchange="regenSingle('xiaohongshu')">
            <option value="种草探店">种草探店</option>
            <option value="干货攻略">干货攻略</option>
            <option value="情绪打卡">情绪打卡</option>
          </select>
        </div>
        <div class="style-group">
          <span class="style-icon dy-dot"></span>
          <select id="dyStyle" onchange="regenSingle('douyin')">
            <option value="正经解说">正经解说</option>
            <option value="搞笑旁白">搞笑旁白</option>
            <option value="打卡推荐">打卡推荐</option>
          </select>
        </div>
      </div>
      <div class="style-row">
        <div class="style-group">
          <span class="style-icon pyq-dot"></span>
          <select id="pyqStyle" onchange="regenSingle('pengyouquan')">
            <option value="文艺清新">文艺清新</option>
            <option value="生活烟火">生活烟火</option>
            <option value="极简金句">极简金句</option>
          </select>
        </div>
        <div class="style-group" style="flex:2;">
          <span class="style-icon custom-dot"></span>
          <input type="text" id="customStyle" placeholder="自选风格，如：用00后语气写…" onchange="regenSingle(currentTab())">
        </div>
      </div>
    </div>

    <div class="entity-section" id="entitySection" style="display:none;">
      <div class="panel-label">识别实体</div>
      <div class="entity-badges" id="entityBadges"></div>
    </div>

    <div class="panel-section">
      <button class="btn btn-primary" id="submitBtn" onclick="doConvert()">生成内容</button>
      <div id="errorMsg" class="error-msg" style="display:none;"></div>
    </div>
  </aside>

  <!-- 右侧预览区 -->
  <main class="preview-area" id="previewArea">
    <div class="output-panel" id="outputPanel">
      <div class="output-col" id="colXhs">
        <div class="output-col-header xhs-header">小红书</div>
        <div class="output-col-body empty">
          <div class="preview-empty">选择样例并点击生成</div>
        </div>
        <div class="action-row">
          <button class="btn btn-action" onclick="actionRefine('shorten')">缩短</button>
          <button class="btn btn-action" onclick="actionRefine('formal')">更正式</button>
          <button class="btn btn-action" onclick="actionRefine('vivid')">更生动</button>
          <button class="btn btn-action" onclick="actionRegen()">重写</button>
          <button class="btn btn-action btn-copy" onclick="actionCopy()">复制</button>
        </div>
      </div>
      <div class="output-col" id="colDy">
        <div class="output-col-header dy-header">抖音</div>
        <div class="output-col-body empty">
          <div class="preview-empty">选择样例并点击生成</div>
        </div>
        <div class="action-row">
          <button class="btn btn-action" onclick="actionRefine('shorten')">缩短</button>
          <button class="btn btn-action" onclick="actionRefine('formal')">更正式</button>
          <button class="btn btn-action" onclick="actionRefine('vivid')">更生动</button>
          <button class="btn btn-action" onclick="actionRegen()">重写</button>
          <button class="btn btn-action btn-copy" onclick="actionCopy()">复制</button>
        </div>
      </div>
      <div class="output-col" id="colPyq">
        <div class="output-col-header pyq-header">朋友圈</div>
        <div class="output-col-body empty">
          <div class="preview-empty">选择样例并点击生成</div>
        </div>
        <div class="action-row">
          <button class="btn btn-action" onclick="actionRefine('shorten')">缩短</button>
          <button class="btn btn-action" onclick="actionRefine('formal')">更正式</button>
          <button class="btn btn-action" onclick="actionRefine('vivid')">更生动</button>
          <button class="btn btn-action" onclick="actionRegen()">重写</button>
          <button class="btn btn-action btn-copy" onclick="actionCopy()">复制</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="/static/js/utils.js"></script>
<script src="/static/js/render.js"></script>
<script src="/static/js/entities.js"></script>
<script src="/static/js/main.js"></script>
</body>
</html>
